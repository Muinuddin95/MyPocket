name: mypocket
description: "A personal expense tracker and budgeting app designed for students."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Animations
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  animated_text_kit: ^4.2.2
  confetti: ^0.8.0
  flutter_svg: ^2.0.9
  
  # State & Storage
  supabase_flutter: ^2.15.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  local_auth: ^2.3.0
  
  # Charts & Data Visualization
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^27.2.5
  
  # Utils
  intl: ^0.19.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.1
  smooth_page_indicator: ^1.2.0+3
  pdf: ^3.11.1
  printing: ^5.13.2
  google_mlkit_text_recognition: ^0.13.1
  http: ^1.2.1
  flutter_inappwebview: ^6.1.5
  dio: ^5.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png

flutter_native_splash:
  color: "#1A5C4A"
  image: assets/images/logo.png
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1A5C4A"
  adaptive_icon_foreground: "assets/images/logo.png"